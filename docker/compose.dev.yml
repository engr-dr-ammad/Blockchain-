version: '3.8'

services:
  node-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iot-shardchain-node-1
    environment:
      NODE_ID: node-1
      NODE_NAME: validator-1
      NODE_PORT: 8001
      DB_PATH: /data/node-1
      PEERS: node-2:8002,node-3:8003
      CHAIN_ID: iot-shardchain-testnet-v1
      NETWORK_ID: 0x1234567890abcdef
      BLOCK_TIME_MS: 5000
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    volumes:
      - node-1-data:/data/node-1
    networks:
      - blockchain-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - node-2
      - node-3

  node-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iot-shardchain-node-2
    environment:
      NODE_ID: node-2
      NODE_NAME: validator-2
      NODE_PORT: 8002
      DB_PATH: /data/node-2
      PEERS: node-1:8001,node-3:8003
      CHAIN_ID: iot-shardchain-testnet-v1
      NETWORK_ID: 0x1234567890abcdef
      BLOCK_TIME_MS: 5000
      LOG_LEVEL: INFO
    ports:
      - "8002:8002"
    volumes:
      - node-2-data:/data/node-2
    networks:
      - blockchain-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  node-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iot-shardchain-node-3
    environment:
      NODE_ID: node-3
      NODE_NAME: validator-3
      NODE_PORT: 8003
      DB_PATH: /data/node-3
      PEERS: node-1:8001,node-2:8002
      CHAIN_ID: iot-shardchain-testnet-v1
      NETWORK_ID: 0x1234567890abcdef
      BLOCK_TIME_MS: 5000
      LOG_LEVEL: INFO
    ports:
      - "8003:8003"
    volumes:
      - node-3-data:/data/node-3
    networks:
      - blockchain-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  node-1-data:
  node-2-data:
  node-3-data:

networks:
  blockchain-net:
    driver: bridge
