version: '3.8'

services:
  validator-0:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iot-shardchain-validator-0
    environment:
      VALIDATOR_ID: "0"
      VALIDATORS_JSON: '{"0": ["validator-0", 8001], "1": ["validator-1", 8002], "2": ["validator-2", 8003]}'
      DB_PATH: /data/validator-0
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8001"
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"   # Consensus port
      - "9001:9001"   # API port
    volumes:
      - validator-0-data:/data/validator-0
    networks:
      - blockchain-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - validator-1
      - validator-2

  validator-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iot-shardchain-validator-1
    environment:
      VALIDATOR_ID: "1"
      VALIDATORS_JSON: '{"0": ["validator-0", 8001], "1": ["validator-1", 8002], "2": ["validator-2", 8003]}'
      DB_PATH: /data/validator-1
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8002"
      LOG_LEVEL: INFO
    ports:
      - "8002:8002"   # Consensus port
      - "9002:9002"   # API port
    volumes:
      - validator-1-data:/data/validator-1
    networks:
      - blockchain-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  validator-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iot-shardchain-validator-2
    environment:
      VALIDATOR_ID: "2"
      VALIDATORS_JSON: '{"0": ["validator-0", 8001], "1": ["validator-1", 8002], "2": ["validator-2", 8003]}'
      DB_PATH: /data/validator-2
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8003"
      LOG_LEVEL: INFO
    ports:
      - "8003:8003"   # Consensus port
      - "9003:9003"   # API port
    volumes:
      - validator-2-data:/data/validator-2
    networks:
      - blockchain-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  validator-0-data:
  validator-1-data:
  validator-2-data:

networks:
  blockchain-net:
    driver: bridge
